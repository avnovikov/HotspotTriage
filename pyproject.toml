[project]
name = "hotspottriage"
version = "0.2.0"
description = "HotspotTriage: rank Python code by complexity × churn (AST metrics via radon)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Alexei Novikov", email = "alexei.128.946@gmail.com" }]
dependencies = [
    "radon>=6.0",
    "pathspec>=0.12",
    "tabulate>=0.9",
    "pyyaml>=6.0",
    "fastmcp>=4.0.2",
    "pylint>=3.0",
    "rich>=13.0",
    "deepcsim>=0.1.2,<0.2",
    "fastapi>=0.141",
    "uvicorn>=0.32",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/avnovikov/HotspotTriage"

[project.scripts]
hotspottriage = "hotspottriage.cli:main"
hotspottriage-mcp = "hotspottriage.mcp_server:main"
hotspottriage-cache = "hotspottriage.cache_generator:main"

[dependency-groups]
dev = [
    "cyclonedx-bom>=7.3.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotspottriage"]

# Floor patched versions for Dependabot advisories on the transitive tree (#202).
[tool.uv]
constraint-dependencies = [
    "mcp>=1.28.1",
    "starlette>=1.3.1",
    "cryptography>=50.0.0",
    "pyjwt>=2.13.0",
    "joserfc>=1.6.8",
    "python-multipart>=0.0.31",
    "pydantic-settings>=2.14.2",
    "idna>=3.15",
]

[tool.pylint.main]
fail-under = 9.0
